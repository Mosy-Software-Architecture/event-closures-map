name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run validate
      - run: npm run validate -- --data examples/malaga-marathon-2026
      - run: npm run build -- --data examples/malaga-marathon-2026
      - run: npm run smoke
        env:
          CHROME_PATH: /usr/bin/google-chrome
